[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bid-toolkit"
version = "4.1.0"
description = "招投标全流程工具链（招标侧+投标侧）——招标文件生成与合规审查、Markdown转Word排版、格式检测、脱敏扫描、三层审标、素材库管家、零依赖RAG、桌面GUI"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "charlotty2026", email = "charlotty8078@agent.qq.com"}
]
dependencies = [
    "python-docx>=0.8.11",
    "markdown>=3.4",
    "pyyaml>=6.0",
    "PyMuPDF>=1.23.0",
    "pdfplumber>=0.7.0",
    "pypinyin>=0.49.0",
    "jieba>=0.42.1",
]
keywords = ["bid", "tender", "procurement", "document", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Legal Industry",
    "Topic :: Office/Business :: Office Suites",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
desktop = [
    "gradio>=4.0.0",
    "pywebview>=4.0.0",
    "screeninfo>=0.8.0",
]

[project.urls]
Homepage = "https://github.com/charlotty2026/bid-toolkit"
Repository = "https://github.com/charlotty2026/bid-toolkit"

[project.scripts]
bid = "bid_toolkit:main"

[tool.setuptools.packages.find]
include = ["bid_toolkit", "bid_toolkit.*"]

[tool.setuptools.package-data]
bid_toolkit = [
    "scripts/*.py",
    "rules/*.json",
    "review/*.json",
    "gui/*.py",
    "templates/*",
    "*.json",
    "*.yaml",
]

[tool.setuptools]
zip-safe = false
