# =============================================================================
# bid-toolkit 排版配置模板（format_config）
# -----------------------------------------------------------------------------
# 用法：把本文件复制为 format_config.yaml，放到 content.json 同级目录，
#       再运行： bid_toolkit render_docx content.json out.docx -c format_config.yaml
#       （若放在 content.json 同级或本包 templates/ 下，可省略 -c 自动发现）
#
# 设计原则：标题一律用真实 Heading 1-5 样式 + numbering.xml 自动编号，
#           客户拿到 Word 后可在「开始 → 样式」里自由改字体/对齐/颜色，
#           编号皮肤也只改下方「标题编号.格式」即可，无需改代码。
# =============================================================================

页面:
  纸张宽cm: 21.0
  纸张高cm: 29.7
  上边距cm: 2.5
  下边距cm: 2.0
  左边距cm: 2.0
  右边距cm: 2.0
  页眉距cm: 1.5
  页脚距cm: 1.75

字体:
  中文字体: "宋体"
  西文字体: "Times New Roman"
  字体颜色: "000000"

正文:
  字号pt: 12.0            # 小四
  行距倍数: 1.5
  首行缩进字符: 2
  对齐: "两端对齐"

# 标题：1-5 级真实 Heading 样式，各级字号/对齐可分别配置（客户可改）
标题:
  字号pt: 16.0
  加粗: true
  对齐: "左对齐"
  段前行: 1.0
  段后行: 1.0
  行距倍数: 1.5
  各级字号pt: [22.0, 18.0, 16.0, 15.0, 14.0]   # 二号/小二/三号/小三/四号
  各级对齐: ["居中", "左对齐", "左对齐", "左对齐", "左对齐"]  # H1居中，其余靠左
  一级标题另起页: true

# ★ 标题自动编号格式（核心可配项）
#   numFmt 可选：chineseCounting(一/二/三) | decimal(1/2/3) | lowerLetter 等
#   lvlText 中 %N 代表"第 N 级自身的计数器"
#   想换成 1 / 1.1 / 1.1.1，只需把下面五级改成：
#     - {numFmt: decimal, lvlText: "%1"}
#     - {numFmt: decimal, lvlText: "%1.%2"}
#     - {numFmt: decimal, lvlText: "%1.%2.%3"}
#     - {numFmt: decimal, lvlText: "%1.%2.%3.%4"}
#     - {numFmt: decimal, lvlText: "%1.%2.%3.%4.%5"}
标题编号:
  级别数: 5
  格式:
    - {numFmt: "chineseCounting", lvlText: "第%1章"}   # 第一章
    - {numFmt: "chineseCounting", lvlText: "%2、"}      # 一、
    - {numFmt: "chineseCounting", lvlText: "（%3）"}    # （一）
    - {numFmt: "decimal",        lvlText: "%4、"}      # 1、
    - {numFmt: "decimal",        lvlText: "%4.%5"}     # 1.1

序号标题:
  字号pt: 12.0
  加粗: false
  行距倍数: 1.5
  首行缩进字符: 2
  左缩进字符: 0

列表:
  字号pt: 12.0
  加粗: false
  行距倍数: 1.5
  首行缩进字符: 2
  每级左缩进字符: 2

表格:
  表题前缀: "表"
  表题字号pt: 10.5
  表题加粗: false
  表题段前行: 0.5
  内容字号pt: 10.5
  表头加粗: true
  边框粗细: 4
  宽度百分比: 100

表格颜色:
  表头背景色: "4472C4"
  表头字体色: "FFFFFF"
  边框色: "000000"
  数据行隔行变色: true
  数据行交替色1: "FFFFFF"
  数据行交替色2: "F2F2F2"

配图:
  图题前缀: "图"
  图题字号pt: 10.5
  图题加粗: true
  图题段后行: 0.5
  图前段前行: 0.5
  默认宽度cm: 12.0
  最大宽度cm: 17.0
  占位文本: "【此处为占位图，请替换为实际截图】"

目录:
  标题文本: "目 录"
  标题字号pt: 16.0
  级别范围: "1-3"

页码:
  字号pt: 10.5
  对齐: "居中"
  起始页码: 1

封面:
  启用: true
  项目名称字号pt: 22.0
  项目名称加粗: true
  投标人字号pt: 16.0
  日期字号pt: 14.0

编号模式:
  标题编号: "全文连续"
  表格编号: "每章重置"
  图片编号: "每章重置"
