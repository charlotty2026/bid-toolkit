# 货物类投标模板
# 适用：设备采购、物资采购、产品供货等货物类招标
# 特点：仿宋正文+黑体标题，1.5倍行距，强调报价表和交货条款
# 与服务标的差异：含交货条款、安装调试、质保期、验收标准等货物特有章节

body:
  font: "仿宋"
  size: 12
  bold: false
  first_indent_chars: 2
  line_spacing: 1.5
  alignment: "justify"

headings:
  h1:
    font: "黑体"
    size: 16
    bold: true
    space_before: 12
    space_after: 6
  h2:
    font: "黑体"
    size: 15
    bold: true
    space_before: 8
    space_after: 4
  h3:
    font: "黑体"
    size: 14
    bold: true
    space_before: 6
    space_after: 3
  h4:
    font: "仿宋"
    size: 14
    bold: true
    space_before: 4
    space_after: 2

table:
  font: "宋体"
  size: 10.5
  bold_header: true
  style: "Table Grid"

page:
  margin_top: 2.54
  margin_bottom: 2.54
  margin_left: 2.50
  margin_right: 2.00
  orientation: "portrait"

# 货物标特有配置
goods:
  # 报价表格式
  pricing_table:
    columns: ["序号", "货物名称", "规格型号", "数量", "单位", "单价(元)", "合价(元)", "产地", "品牌"]
    bold_header: true
    align_numbers: right
    total_row: true
  
  # 中小企业声明函 - 货物标需填制造商
  sme_declaration:
    mode: "goods"  # goods模式需列出所有主材/设备制造商
    note: "货物标须填列所有主材/设备的制造商信息，不是只填投标方自己"
  
  # 质保条款默认值（按招标文件覆盖）
  warranty:
    default_period: "一年"  # 默认质保期，以招标文件要求为准
    response_time: "2小时"
    onsite_time: "8小时"
    resolution_time: "24小时"
    note: "必须逐字对标招标文件，不能套模板"
