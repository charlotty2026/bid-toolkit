# 工程类投标模板
# 适用：建筑工程、市政工程、道路桥梁等工程类招标
# 特点：黑体标题+宋体正文，固定28磅行距，页边距稍大

body:
  font: "宋体"
  size: 12
  bold: false
  first_indent_chars: 2
  line_spacing: 28
  alignment: "justify"

headings:
  h1:
    font: "黑体"
    size: 16
    bold: true
    space_before: 12
    space_after: 6
  h2:
    font: "黑体"
    size: 15
    bold: true
    space_before: 8
    space_after: 4
  h3:
    font: "宋体"
    size: 14
    bold: true
    space_before: 6
    space_after: 3

table:
  font: "宋体"
  size: 10.5
  bold_header: true
  style: "Table Grid"

page:
  margin_top: 3.00
  margin_bottom: 2.50
  margin_left: 2.50
  margin_right: 2.00
  orientation: "portrait"
